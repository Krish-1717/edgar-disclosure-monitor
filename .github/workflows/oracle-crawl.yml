# ORACLE scheduled crawl: keeps the site's SEC data fresh without a server.
#
# Every 15 minutes: crawl new filings for the 20 featured companies, rebuild the static
# feeds and diffs, write Claude Opus 5.5 analyses for new 10-K/10-Q diffs (capped spend),
# and commit anything that changed. GitHub Pages redeploys on the commit.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ORACLE_USER_AGENT   required. SEC fair-access User-Agent, e.g. "EDGAR-Monitor/2.0 (research; you@example.com)"
#   ANTHROPIC_API_KEY   optional. Without it the AI step is skipped.
name: ORACLE crawl

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ai_budget_usd:
        description: "Max Claude spend for this run (USD)"
        default: "1.00"

permissions:
  contents: write

concurrency:
  group: oracle-crawl
  cancel-in-progress: false

env:
  TICKERS: "NVDA AAPL MSFT GOOGL META AMZN TSLA JPM BAC GS NFLX LLY XOM AMD NKE BRK-B V MA UNH PYPL"
  OUT: assets/data/oracle

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-oracle.txt

      - run: pip install -r requirements-oracle.txt

      # Only the SQLite database is kept between runs (sections, extracted extras, what was
      # already fetched), so each run downloads new filings only.
      - name: Restore crawl database
        uses: actions/cache/restore@v4
        with:
          path: data/oracle/oracle.db
          key: oracle-db-${{ github.run_id }}
          restore-keys: oracle-db-

      - name: Check secrets
        env:
          ORACLE_USER_AGENT: ${{ secrets.ORACLE_USER_AGENT }}
        run: |
          if [ -z "$ORACLE_USER_AGENT" ]; then
            echo "::error::Add the ORACLE_USER_AGENT repository secret (SEC requires a User-Agent with a contact email)."
            exit 1
          fi

      - name: Crawl new filings
        env:
          ORACLE_USER_AGENT: ${{ secrets.ORACLE_USER_AGENT }}
        run: |
          python -m oracle crawl $TICKERS --forms 10-K,10-Q --limit 6 || true
          python -m oracle crawl $TICKERS --forms 8-K --limit 3 || true
          python -m oracle crawl $TICKERS --forms "DEF 14A" --limit 1 || true
          python -m oracle crawl $TICKERS --forms 4 --limit 3 || true

      - name: Export feeds and diffs
        env:
          ORACLE_USER_AGENT: ${{ secrets.ORACLE_USER_AGENT }}
        run: |
          python -m oracle export $TICKERS --out $OUT
          python -m oracle universe --out $OUT/universe.json

      - name: Claude Opus 5.5 analyses (capped)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m oracle summarize --out $OUT --max-filings 5 --budget-usd "${{ inputs.ai_budget_usd || '1.00' }}"
          python -m oracle export $TICKERS --out $OUT

      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- $OUT)" ]; then
            echo "No new data."
            exit 0
          fi
          git config user.name "oracle-crawler[bot]"
          git config user.email "oracle-crawler[bot]@users.noreply.github.com"
          git add $OUT
          git commit -m "data: ORACLE crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save crawl database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/oracle/oracle.db
          key: oracle-db-${{ github.run_id }}
